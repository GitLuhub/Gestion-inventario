# alembic.ini — configuración de migraciones para la BD de control del ETL
# La BD de control registra el historial de ejecuciones del pipeline ETL
# y es independiente de la BD principal de Odoo (PostgreSQL).

[alembic]
# Ruta al directorio de migraciones
script_location = alembic

# Plantilla para nombres de archivos de migración: fecha + descripción corta
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# URL de conexión — se sobreescribe por env var ETL_DB_URL en env.py
sqlalchemy.url = postgresql://odoo:odoo_dev_pass@localhost:5432/odoo_db

# Nivel de log para sqlalchemy.engine (útil para depuración)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
