# RNF2: least_conn distribuye las peticiones al worker con menos conexiones activas.
# En producción con --scale odoo_app=N, Docker DNS resuelve "odoo_app" a todas las
# réplicas y el upstream itera sobre ellas con la estrategia seleccionada.
# keepalive 32: mantiene conexiones TCP persistentes hacia Odoo para evitar el
# overhead de TCP handshake en cada petición.
upstream odoo_backend {
    least_conn;
    server odoo_app:8069;
    keepalive 32;
}

# RNF2: longpolling usa un puerto dedicado (8072) separado del tráfico HTTP normal.
# Esto permite que los workers de Odoo procesen JSONRPC sin bloquear las conexiones
# de larga duración del bus de mensajes (notificaciones en tiempo real).
upstream odoo_longpolling {
    server odoo_app:8072;
    keepalive 16;
}

upstream api_gateway_backend {
    server api_gateway:8000;
    keepalive 16;
}

upstream frontend_backend {
    server frontend:3000;
    keepalive 16;
}

# RNF4: Redirigir todo el tráfico HTTP a HTTPS.
# Solo se mantiene el endpoint /health para que docker-compose pueda verificar
# que nginx está activo sin necesitar el certificado SSL.
server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# RNF4: Servidor HTTPS con terminación SSL en nginx.
# Los certificados se generan con setup_secrets.sh (autofirmados para dev,
# Let's Encrypt para producción vía docker-compose.prod.yml).
server {
    listen 443 ssl;
    server_name _;

    # RNF4: Certificados SSL (montados desde secrets/certs/ en docker-compose.yml)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # RNF4: Solo protocolos modernos; SSLv3 y TLS 1.0/1.1 son inseguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # RNF4: Reutilizar sesiones TLS evita el full handshake en reconexiones
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # RNF4: Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_body_buffer_size 100M;
    proxy_buffering off;
    proxy_request_buffering off;

    # J2: Cache-Control para assets estáticos del frontend
    # Next.js genera assets con hash en el nombre (_next/static/) — son inmutables.
    # El navegador los cachea 1 año y nunca los revalida (Cache-Control: immutable).
    location /_next/static/ {
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status "static-asset";
    }

    # Archivos públicos (imágenes, iconos, etc.)
    location /public/ {
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Assets estáticos de Odoo (CSS, JS, imágenes del ERP)
    location ~* ^/web/static/ {
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";  # 7 días
        proxy_read_timeout 300;
    }

    location /mail/ {
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_connect_timeout 900;
        proxy_send_timeout 900;
    }

    location /bus/ {
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_connect_timeout 900;
        proxy_send_timeout 900;
    }

    location /websocket {
        proxy_pass http://odoo_longpolling;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_connect_timeout 900;
        proxy_send_timeout 900;
    }

    location / {
        proxy_pass http://frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location /api/ {
        proxy_pass http://api_gateway_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location /web/ {
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_connect_timeout 900;
        proxy_send_timeout 900;
    }

    location /jsonrpc/ {
        proxy_pass http://odoo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_connect_timeout 900;
        proxy_send_timeout 900;
    }

    # RNF2: longpolling usa el upstream dedicado en puerto 8072
    location /longpolling/ {
        proxy_pass http://odoo_longpolling;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_connect_timeout 900;
        proxy_send_timeout 900;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
