server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Logs de contenedores Docker vía archivos de log del daemon
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containers
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            attrs: attrs
      - json:
          source: attrs
          expressions:
            tag: tag
      - regex:
          source: tag
          expression: '^(?P<container_name>[^/]+)/(?P<image_name>[^:]+)'
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
          container_name:
          image_name:
      - output:
          source: log

  # Logs de Odoo (ruta específica del contenedor mapeada)
  - job_name: odoo
    static_configs:
      - targets:
          - localhost
        labels:
          job: odoo
          service: odoo_app
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            attrs: attrs
      - json:
          source: attrs
          expressions:
            tag: tag
      - match:
          selector: '{job="odoo"}'
          stages:
            - regex:
                source: log
                expression: '^(?P<level>DEBUG|INFO|WARNING|ERROR|CRITICAL)\s+(?P<logger>\S+)\s+(?P<message>.+)$'
            - labels:
                level:
                logger:
