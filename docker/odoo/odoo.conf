[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; --- Rendimiento (RNF1) ---
; Workers se sobreescribe desde env ODOO_WORKERS en docker-compose
workers = 2
max_cron_threads = 1
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192
longpolling_port = 8072

; --- Proxy / Seguridad (RNF4) ---
; Obligatorio cuando Odoo está detrás de nginx:
; - registra la IP real del cliente en lugar de la del proxy
; - genera URLs con el esquema correcto (https://) en correos y redirects
proxy_mode = True

; --- Logging ---
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO
