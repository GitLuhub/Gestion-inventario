global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'inventory-local'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'pg_db'
    static_configs:
      - targets: ['pg_db:5432']

  - job_name: 'odoo_app'
    static_configs:
      - targets: ['odoo_app:8069']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'api_gateway'
    static_configs:
      - targets: ['api_gateway:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'etl_service'
    static_configs:
      - targets: ['etl_service:8001']
    metrics_path: '/metrics'
    scrape_interval: 60s

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
