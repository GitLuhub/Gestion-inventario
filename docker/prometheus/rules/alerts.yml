groups:
  - name: api_gateway_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(api_gateway_requests_total{status=~"5.."}[5m])) 
          / sum(rate(api_gateway_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in API Gateway"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95, sum(rate(api_gateway_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time in API Gateway"
          description: "95th percentile response time is {{ $value }}s (threshold: 2s)"

      - alert: APIGatewayDown
        expr: up{job="api_gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Gateway is down"
          description: "API Gateway has been down for more than 1 minute"

  - name: host_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage"
          description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.mountpoint }}"

      - alert: HostDown
        expr: up{job="node_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host is down"
          description: "{{ $labels.instance }} has been down for more than 1 minute"

  - name: postgres_alerts
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: up{job="postgres_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL exporter has been down for more than 1 minute"

      - alert: PostgreSQLHighConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of PostgreSQL connections"
          description: "PostgreSQL connections are at {{ $value | humanizePercentage }} of maximum"

  - name: etl_alerts
    interval: 60s
    rules:
      - alert: ETLJobFailed
        expr: increase(etl_job_errors_total[1h]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "ETL acumuló demasiados errores"
          description: "ETL acumuló {{ $value }} errores en la última hora (umbral: 5)"

      - alert: ETLJobNotRunning
        expr: |
          time() - etl_job_last_success_timestamp > 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "ETL job has not run recently"
          description: "ETL job last ran successfully more than 24 hours ago"

  - name: odoo_alerts
    interval: 30s
    rules:
      - alert: OdooDown
        expr: up{job="odoo_app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Odoo está caído"
          description: "El servicio Odoo lleva más de 1 minuto sin responder"

      - alert: OdooHighMemoryUsage
        expr: |
          (container_memory_usage_bytes{name="inventory_odoo_app"}
          / container_spec_memory_limit_bytes{name="inventory_odoo_app"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Odoo usando más del 85% de memoria"
          description: "Odoo consume {{ $value | humanizePercentage }} de su límite de memoria (4G)"

      - alert: OdooWorkersSaturated
        expr: |
          sum(odoo_http_request_duration_seconds_count{job="odoo_app"}) by (instance)
          / scalar(odoo_workers_count) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Workers de Odoo saturados"
          description: "Más de 10 requests por worker activo durante 5 minutos"
