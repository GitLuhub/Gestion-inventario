# docker-compose.yml - Sistema de Gestión de Inventario Avanzado
# Odoo 16.0 LTS + ETL + FastAPI Gateway + Next.js Frontend

# ----------------------------------------------------
# 1. Definición de volúmenes persistentes
# ----------------------------------------------------
volumes:
  pg_data:
    name: inventory_pg_data
  odoo_data:
    name: inventory_odoo_data
  odoo_addons:
    name: inventory_odoo_addons
  etl_data:
    name: inventory_etl_data
  prometheus_data:
    name: inventory_prometheus_data
  grafana_data:
    name: inventory_grafana_data
  loki_data:
    name: inventory_loki_data

# ----------------------------------------------------
# 2. Definición de secretos (para producción usar Docker Swarm secrets)
# Para desarrollo local, usamos variables de entorno
# ----------------------------------------------------

# ----------------------------------------------------
# 3. Redes
# ----------------------------------------------------
networks:
  backend-network:
    driver: bridge
    name: inventory_backend

# ----------------------------------------------------
# 4. Servicios
# ----------------------------------------------------
services:

  # ----------------------------------------------------
  # 4.1. PostgreSQL Database
  # ----------------------------------------------------
  pg_db:
    image: postgres:15-alpine
    container_name: inventory_pg_db
    hostname: pg_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo_db}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_dev_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ----------------------------------------------------
  # 4.2. ODOO Application
  # ----------------------------------------------------
  odoo_app:
    build:
      context: .
      dockerfile: ./docker/odoo/Dockerfile
    image: inventory-odoo:16.0
    container_name: inventory_odoo_app
    hostname: odoo_app
    env_file:
      - .env
    environment:
      HOST: pg_db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_dev_pass}
      PGPASSWORD: ${POSTGRES_PASSWORD:-odoo_dev_pass}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:-admin}
      ODOO_LOGLEVEL: ${ODOO_LOGLEVEL:-info}
      ODOO_WORKERS: 2
      ODOO_LIMIT_TIME_CPU: 600
      ODOO_LIMIT_TIME_REAL: 1200
      ODOO_MAX_CRON_THREADS: 1
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_addons:/mnt/extra-addons
      - ./docker/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
    networks:
      - backend-network
    ports:
      - "8069:8069"
      - "8071:8071"
      - "8072:8072"
    depends_on:
      pg_db:
        condition: service_healthy
    # RNF3: healthcheck activo en compose (además del HEALTHCHECK del Dockerfile).
    # Verifica que el worker HTTP de Odoo acepta peticiones en el puerto 8069.
    # start_period=120s da tiempo al inicio de Odoo + carga del módulo custom.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/login > /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ----------------------------------------------------
  # 4.3. ETL Service (Python)
  # ----------------------------------------------------
  etl_service:
    build:
      context: ./etl_service
      dockerfile: Dockerfile
    image: inventory-etl:latest
    container_name: inventory_etl_service
    hostname: etl_service
    env_file:
      - .env
    environment:
      ODOO_URL: http://odoo_app:8069
      ODOO_DB: ${POSTGRES_DB:-odoo_db}
      ODOO_USER: ${ODOO_ETL_USER:-admin}
      ODOO_PASSWORD: ${ODOO_ETL_PASSWORD:-admin}
      EXTERNAL_API_URL: "http://external-api:8080/api/v1"
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-local_key}
      ETL_DATA_PATH: /app/data
      ETL_LOG_LEVEL: INFO
      ETL_SCHEDULE_CRON: "*/15 * * * *"
      ETL_DB_URL: "postgresql://odoo:${POSTGRES_PASSWORD:-odoo_dev_pass}@pg_db:5432/${POSTGRES_DB:-odoo_db}"
    volumes:
      - etl_data:/app/data
    networks:
      - backend-network
    depends_on:
      # RNF3: ETL no arranca hasta que Odoo esté saludable; evita errores de
      # conexión en las primeras ejecuciones del cron de ETL.
      odoo_app:
        condition: service_healthy
    command: ["cron", "-f"]
    # RNF3: verifica que el proceso cron sigue vivo dentro del contenedor
    healthcheck:
      test: ["CMD-SHELL", "grep -q cron /proc/1/cmdline || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ----------------------------------------------------
  # 4.4. API Gateway FastAPI
  # ----------------------------------------------------
  api_gateway:
    build:
      context: ./api_gateway_service
      dockerfile: Dockerfile
    image: inventory-api-gateway:latest
    container_name: inventory_api_gateway
    hostname: api_gateway
    env_file:
      - .env
    environment:
      ODOO_URL: http://odoo_app:8069
      ODOO_DB: ${POSTGRES_DB:-odoo_db}
      ODOO_USER: ${ODOO_ADMIN_USER:-admin}
      ODOO_PASSWORD: ${ODOO_MASTER_PASSWORD:-admin}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_jwt_secret_key_change_in_production}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: info
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080"
    ports:
      - "8000:8000"
    networks:
      - backend-network
    depends_on:
      - odoo_app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ----------------------------------------------------
  # 4.5. Frontend Next.js
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        API_INTERNAL_URL: http://api_gateway:8000
    image: inventory-frontend:latest
    container_name: inventory_frontend
    hostname: frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: http://api_gateway:8000
      NEXT_PUBLIC_APP_NAME: "Gestión de Inventario"
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - backend-network
    depends_on:
      - api_gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ----------------------------------------------------
  # 4.6. Nginx Reverse Proxy
  # ----------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    container_name: inventory_nginx
    hostname: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./secrets/certs:/etc/nginx/certs:ro
    networks:
      - backend-network
    depends_on:
      - odoo_app
      - api_gateway
      - frontend
    # RNF3: nginx -t valida la config; el curl verifica que el servidor HTTP responde
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null && curl -sf http://localhost/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ----------------------------------------------------
  # 4.7. Prometheus (Monitoreo)
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: inventory_prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - backend-network
    # RNF3: /-/healthy devuelve 200 cuando Prometheus está listo para scraping
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q 'Prometheus' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------
  # 4.8. Grafana (Dashboards)
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: inventory_grafana
    hostname: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # RNF4: nunca hardcodear contraseñas; usar variable de entorno desde .env
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD no definida en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - backend-network
    depends_on:
      # RNF3: Grafana arranca solo cuando Prometheus ya acepta queries.
      # Loki NO está aquí porque pertenece al perfil "monitoring" y Docker Compose
      # no permite depends_on sobre servicios que pueden no estar en el proyecto.
      # Grafana se conecta a Loki como datasource cuando el perfil monitoring está activo.
      prometheus:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------
  # 4.9. PostgreSQL Backup (perfil: production)
  # Ejecuta pg_dump diariamente a las 2am y retiene N días de backups
  # ----------------------------------------------------
  pg_backup:
    image: postgres:15-alpine
    container_name: inventory_pg_backup
    hostname: pg_backup
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo_db}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-odoo_dev_pass}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    command: >
      /bin/sh -c "
        echo '0 2 * * * /backup.sh >> /var/log/backup.log 2>&1' | crontab - &&
        crond -f -l 2
      "
    depends_on:
      pg_db:
        condition: service_healthy
    networks:
      - backend-network
    restart: unless-stopped
    profiles:
      - production

  # ----------------------------------------------------
  # 4.10. Node Exporter (Métricas Host)
  # ----------------------------------------------------
  node_exporter:
    image: prom/node-exporter:latest
    container_name: inventory_node_exporter
    hostname: node_exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - backend-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ----------------------------------------------------
  # 4.11. Loki — Almacenamiento de logs (perfil: monitoring)
  # ----------------------------------------------------
  loki:
    image: grafana/loki:2.9.0
    container_name: inventory_loki
    hostname: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - backend-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ----------------------------------------------------
  # 4.12. Promtail — Agente de recolección de logs (perfil: monitoring)
  # ----------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.0
    container_name: inventory_promtail
    hostname: promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    networks:
      - backend-network
    depends_on:
      - loki
    restart: unless-stopped
    profiles:
      - monitoring

  # ----------------------------------------------------
  # 4.13. PostgreSQL Exporter
  # ----------------------------------------------------
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: inventory_postgres_exporter
    hostname: postgres_exporter
    environment:
      DATA_SOURCE_NAME: postgresql://odoo@pg_db:5432/odoo_db?sslmode=disable
    networks:
      - backend-network
    depends_on:
      pg_db:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - monitoring
